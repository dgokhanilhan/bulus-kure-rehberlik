# PR'da ve main'e her birleştirmede: tip kontrolü, birim/RLS testleri ve uçtan uca testler (yerel Supabase ile).
# Uçtan uca testler 4 paralel işe bölünür (her işin kendi yerel Supabase'i var; birbirini etkilemez).
# Dallara push ayrıca çalışmaz (aynı commit PR'da zaten test edilir); aynı PR'a yeni push eski çalıştırmayı iptal eder.
name: Test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.120.0 }
      - run: npm ci
      - run: supabase start -x studio,imgproxy,vector,logflare
      - run: supabase status -o env | sed -E 's/^API_URL=/VITE_SUPABASE_URL=/; s/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' | grep -E '^(VITE_|SUPABASE_SERVICE)' > .env.local
      - run: cp supabase/functions/.env.example supabase/functions/.env
      - run: npm run functions &
      - run: npx playwright install --with-deps chromium
      - if: matrix.shard == 1
        run: npm run typecheck
      # Üretim derlemesi + dist bütünlük kontrolü (eksik asset, _headers, önbellek kuralları; deploy/dist-kontrol.ts)
      - if: matrix.shard == 1
        run: npm run build
      - if: matrix.shard == 1
        run: npm run test
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4
      # Düşen e2e testinin ekran görüntüsü ve izi (trace) indirilebilsin
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-hata-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

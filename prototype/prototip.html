<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>Buluş Küre Rehberlik & Mentörlük</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#f6f3ec;--surface:#ffffff;--sunken:#ece6d9;--line:#e3ddd0;--line-strong:#8a8f88;
  --ink:#1b2a2f;--ink-2:#3b4a50;--muted:#56636a;
  --primary:#1f5f5b;--on-primary:#ffffff;--primary-soft:#e1eeeb;--primary-line:#c5dcd7;--bar-soft:#cfe0dc;
  --signal:#b5541a;--signal-soft:#fbe9da;--signal-line:#f0c6a6;
  --hl:#e7c57a;--ink-fixed:#1b2a2f;
  --nav:#1b2a2f;--nav-2:#24363b;--nav-active:#2e4349;--on-nav:#f6f3ec;--on-nav-muted:#c9d2d4;
  --heat1:#b5541a;--heat2:#f2c4a2;--heat3:#cfe0dc;--heat4:#1f5f5b;
  --shadow:0 1px 2px rgba(27,42,47,.08),0 8px 24px rgba(27,42,47,.06);
  --display:Fraunces,Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#121b1e;--surface:#1b2a2f;--sunken:#24363b;--line:#2e4349;--line-strong:#7d8b8f;
  --ink:#f1ede4;--ink-2:#d3d9d8;--muted:#aebbbe;--primary:#7cc2b5;--on-primary:#10201f;--primary-soft:#1f3b39;--primary-line:#2d5652;--bar-soft:#2d5652;
  --signal:#f0a36b;--signal-soft:#3a2618;--signal-line:#6a4128;--nav:#0c1416;--nav-2:#16242a;--nav-active:#24363b;--on-nav:#f1ede4;--on-nav-muted:#aebbbe;}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#121b1e;--surface:#1b2a2f;--sunken:#24363b;--line:#2e4349;--line-strong:#7d8b8f;
  --ink:#f1ede4;--ink-2:#d3d9d8;--muted:#aebbbe;--primary:#7cc2b5;--on-primary:#10201f;--primary-soft:#1f3b39;--primary-line:#2d5652;--bar-soft:#2d5652;
  --signal:#f0a36b;--signal-soft:#3a2618;--signal-line:#6a4128;--nav:#0c1416;--nav-2:#16242a;--nav-active:#24363b;--on-nav:#f1ede4;--on-nav-muted:#aebbbe;}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.m{color:var(--muted)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(231,197,122,.55)}50%{box-shadow:0 0 0 10px rgba(231,197,122,0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.95)}10%,88%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,10px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sheet{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-16px) scale(1.08)}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.enter .a{animation:rise .5s var(--ease) both;animation-delay:calc(var(--d,0) * 50ms)}
.enter .pp{animation:pop .4s var(--ease) both;animation-delay:calc(var(--d,0) * 18ms)}
.enter .bar-g{transform-origin:left;animation:grow .9s var(--ease) both;animation-delay:.2s}
.draw{stroke-dasharray:1;animation:draw 1.3s var(--ease) both;animation-delay:.15s}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.floaty{animation:float 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.btn{min-height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),background .2s,box-shadow .2s;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{box-shadow:var(--shadow)}
.btn:active,.press:active{transform:scale(.96)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.btn.soft{background:var(--primary-soft);color:var(--primary);border-color:transparent;font-weight:600}
.btn.gold{background:var(--hl);color:var(--ink-fixed);border-color:transparent;font-weight:600}
.btn.warn{background:var(--signal-soft);color:var(--signal);border-color:transparent;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary);padding:0 6px;box-shadow:none}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn[disabled]{background:var(--sunken);color:var(--muted);border-color:var(--sunken);cursor:not-allowed;box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{position:relative;display:inline-flex;gap:2px;background:var(--sunken);padding:4px;border-radius:12px;max-width:100%;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;border:0;background:transparent;min-height:36px;padding:0 13px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.ind{position:absolute;z-index:0;border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(27,42,47,.16);top:4px;bottom:4px;left:0;width:0;transition:transform .45s var(--ease),width .45s var(--ease)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.up{background:var(--primary-soft);color:var(--primary)}
.chip.down{background:var(--signal-soft);color:var(--signal)}
.chip.n{background:var(--sunken);color:var(--ink-2)}
.chip.gold{background:var(--hl);color:var(--ink-fixed)}
.chip.dark{background:var(--nav);color:var(--on-nav)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.lift{transition:transform .25s var(--ease),box-shadow .25s}
.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.dark{background:var(--nav);color:var(--on-nav);border-radius:18px}
.dark .m{color:var(--on-nav-muted)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--hl);color:var(--ink-fixed);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.av.s{background:var(--sunken);color:var(--ink)}
.prog{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.big{font-family:var(--mono);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select,.field textarea{min-height:44px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:0 12px;font-weight:400;width:100%;transition:border-color .2s,box-shadow .2s}
.field textarea{padding:10px 12px;min-height:90px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,.ptxt:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.err{color:var(--signal);font-size:13px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:8px 0;text-align:left;width:100%}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;transition:all .25s var(--ease);color:var(--on-primary)}
.box.on{background:var(--primary);border-color:var(--primary)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line-strong);position:relative;flex-shrink:0;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--primary)}.sw.on::after{transform:translateX(18px)}
.spinner{display:inline-block;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--sunken);border-top-color:var(--primary);animation:spin .8s linear infinite;vertical-align:middle}

details.dd{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:box-shadow .25s}
details.dd[open]{box-shadow:var(--shadow)}
details.dd>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 18px;cursor:pointer;user-select:none}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary .t{flex:1;min-width:0}
details.dd>summary b{display:block;font-size:15px}
details.dd>summary small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{display:inline-flex;transition:transform .35s var(--ease);color:var(--muted)}
details.dd[open] .chev{transform:rotate(180deg)}
.dd-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
details.dd[open] .dd-body{animation:drop .35s var(--ease)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;min-height:62px}
.brandline{display:flex;align-items:center;gap:10px;min-width:0}
.brandline b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1;display:block;white-space:nowrap}
.brandline small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.bell .dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--signal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--paper)}
.bell.has svg{animation:ring 1.2s ease 1}
.who{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.who b{display:block;font-size:14px;line-height:1.2}.who small{display:block;font-size:12px;color:var(--muted)}
.npanel{position:fixed;top:70px;right:16px;z-index:45;width:min(400px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 90px));overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(27,42,47,.2);animation:drop .3s var(--ease)}
.nitem{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;transition:background .2s}
.nitem:hover{background:var(--paper)}
.nitem.unread{background:color-mix(in srgb,var(--hl) 16%,var(--surface))}

/* app shell */
.app{display:flex;min-height:calc(100vh - 62px)}
.side{width:224px;flex-shrink:0;background:var(--nav);color:var(--on-nav);display:flex;flex-direction:column;gap:18px;padding:18px 12px;position:sticky;top:62px;height:calc(100vh - 62px)}
.nav{position:relative;display:flex;flex-direction:column;gap:4px}
.nav .ind{background:var(--nav-active);box-shadow:none;border-radius:10px;left:0;right:0;top:0;bottom:auto;width:auto;height:46px}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--on-nav-muted);font-size:15px;text-align:left;transition:color .25s}
.nav button:hover{color:var(--on-nav)}
.nav button[aria-pressed="true"]{color:var(--on-nav);font-weight:600}
.nav .badge{margin-left:auto;font-size:12px;background:var(--hl);color:var(--ink-fixed);border-radius:99px;padding:1px 8px;font-weight:700}
.side .rolebox{margin-top:auto;padding:12px;border-radius:12px;background:var(--nav-2);font-size:13px;color:var(--on-nav-muted)}
main.view{flex:1;min-width:0;padding:28px 36px 60px;display:flex;flex-direction:column;gap:20px}
h1.hd{font-family:var(--display);font-size:32px;font-weight:500;letter-spacing:-.5px;line-height:1.12;text-wrap:balance}
h2.sec{font-size:17px;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) var(--side,340px);gap:20px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs .ind{top:auto;bottom:0;height:3px;border-radius:3px;background:var(--primary);box-shadow:none}
.tabs button{position:relative;z-index:1;border:0;background:transparent;min-height:46px;padding:0 14px;font-size:15px;color:var(--muted);font-weight:500;white-space:nowrap;transition:color .25s}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;font-weight:600;white-space:nowrap}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{transition:background .2s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover{background:var(--paper)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hist{display:flex;gap:4px}
.hist i{width:18px;height:18px;border-radius:5px;display:block}
.h-y{background:var(--signal)}.h-d{background:var(--primary)}.h-n{background:var(--line)}.h-b{background:var(--hl)}
.h-o{background:repeating-linear-gradient(45deg,var(--line-strong) 0 2px,transparent 2px 6px);border:1px solid var(--line-strong)}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{width:18px;height:12px;border-radius:4px;display:inline-block}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.srow{width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px;transition:background .2s}
.srow:hover{background:var(--paper)}
.issue{padding:18px 20px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--signal-line);transition:border-color .3s,background .3s}
.issue.ok{border-color:var(--primary-line);background:var(--primary-soft)}
.issue .t{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--signal)}
.issue.ok .t{color:var(--primary)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;font-size:14px;font-weight:500;background:var(--sunken);color:var(--muted);transition:all .4s var(--ease)}
.steps li span{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--surface)}
.steps li.on{background:var(--nav);color:var(--on-nav)}.steps li.on span{background:var(--hl);color:var(--ink-fixed)}
.steps li.done{background:var(--primary-soft);color:var(--primary)}
.drop{border:2px dashed var(--line-strong);border-radius:22px;background:var(--surface);padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transition:border-color .3s,background .3s}
.drop.over,.drop:hover{border-color:var(--primary);background:var(--primary-soft)}
.heat{display:grid;grid-template-columns:minmax(170px,1.3fr) repeat(var(--n,5),minmax(58px,1fr));gap:7px;align-items:center;min-width:520px}
.heat .c{height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;transition:transform .2s var(--ease)}
.heat .c:hover{transform:scale(1.07)}
.xl{cursor:pointer}
.xl:hover text.lbl{fill:var(--primary);font-weight:700}

/* modal + report */
.mwrap{position:fixed;inset:0;z-index:55;background:rgba(12,20,22,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px 16px;animation:fade .25s both}
.modal{width:100%;max-width:var(--mw,560px);background:var(--surface);color:var(--ink);border-radius:24px;box-shadow:0 30px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;animation:sheet .4s var(--ease) both;max-height:calc(100vh - 40px);overflow:hidden}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1;font-family:var(--display);font-size:23px;font-weight:500;min-width:0}
.modal-b{padding:18px 22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.modal-f{padding:14px 22px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.xbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--sunken);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease)}
.xbtn:hover{transform:rotate(90deg)}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:all .25s var(--ease)}
.pick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.stepper input{width:76px;text-align:center;font-family:var(--mono);font-size:20px;min-height:42px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface)}
.rwrap{position:fixed;inset:0;z-index:50;background:rgba(12,20,22,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;padding:0 16px 48px;animation:fade .3s both}
.rbar{position:sticky;top:0;z-index:2;max-width:840px;margin:0 auto 14px;padding:14px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#f6f3ec}
.rbar b{flex:1;font-size:16px;min-width:180px}
.rbar .btn{min-height:40px}
.paper{max-width:794px;margin:0 auto;background:#fff;color:#1b2a2f;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:44px 50px;display:flex;flex-direction:column;gap:20px;animation:sheet .5s var(--ease) both;font-size:14px;line-height:1.6}

.paper p.tx{white-space:pre-wrap}
.paper .foot{border-top:1px solid #e3ddd0;padding-top:10px;display:flex;justify-content:space-between;font-size:11px;color:#56636a;gap:10px;flex-wrap:wrap}
.ptxt{width:100%;border:1px dashed #c9c0ae;border-radius:10px;background:#fffdf7;color:#1b2a2f;padding:10px 12px;font:inherit;line-height:1.6;resize:vertical;min-height:70px}
.paper .sec{break-inside:avoid;page-break-inside:avoid}
.aibox{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:#f6f3ec;color:#1b2a2f;font-size:13px}

/* ============ calculations ============ */
const exams=()=>DB.exams.slice().sort((a,b)=>a.date.localeCompare(b.date));
const stu=id=>DB.students.find(s=>s.id===id);
const user=id=>DB.users.find(u=>u.id===id);
const userName=id=>user(id)?.name||'Sistem';
function score(eid,sid){
  const r=DB.results[eid]?.[sid];if(!r)return null;
  const o={ders:{},net:0,wnet:0};
  for(const d of DERS){const s=r.a[d.k];const D=[...s].filter(c=>c==='d').length,Y=[...s].filter(c=>c==='y').length,B=[...s].filter(c=>c==='b').length;const net=D-Y/3;o.ders[d.k]={d:D,y:Y,b:B,net};o.net+=net;o.wnet+=net*d.w;}
  o.puan=100+o.wnet/270*400;return o;
}
const examsOf=sid=>exams().filter(e=>DB.results[e.id]?.[sid]);
function konuStatus(eid,sid,dk,j){
  const e=DB.exams.find(x=>x.id===eid),r=DB.results[eid]?.[sid];if(!r)return'x';
  const qs=e.key[dk].map((q,i)=>({q,a:r.a[dk][i]})).filter(o=>o.q.k===j);
  if(!r.kz||e.key[dk].every(q=>q.k===null))return'o';
  const rel=qs.filter(o=>o.q.c!=='guess');
  if(!rel.length)return qs.length?'o':'n';
  if(rel.some(o=>o.a==='y'))return'y';if(rel.every(o=>o.a==='d'))return'd';return'b';
}
function repeats(sid,uptoEid){
  const ex=examsOf(sid).filter(e=>!uptoEid||e.date<=DB.exams.find(x=>x.id===uptoEid).date);const out=[];
  for(const d of DERS)KONU[d.k].forEach(([code,ad],j)=>{const st=ex.map(e=>konuStatus(e.id,sid,d.k,j));const c=st.filter(x=>x==='y').length;if(c>=2)out.push({dk:d.k,j,code,ad,count:c,hist:st,names:ex.filter((e,i)=>st[i]==='y').map(e=>e.name),lastWrong:st[st.length-1]==='y'})});
  return out.sort((a,b)=>b.count-a.count||(b.lastWrong-a.lastWrong));
}
function attention(){
  const ex=exams(),L=ex[ex.length-1],P=ex[ex.length-2],out=[];
  for(const s of DB.students){
    const a=L&&score(L.id,s.id),b=P&&score(P.id,s.id);
    if(!a&&!b){out.push({s,k:'n',tag:'Eksik',short:`Son 2 denemeye (${P?.name}, ${L?.name}) girmedi`,pr:3});continue}
    if(!a){out.push({s,k:'n',tag:'Eksik',short:`${L.name} denemesine girmedi`,pr:4});continue}
    const rep=repeats(s.id).filter(r=>r.count>=3&&r.lastWrong);
    if(a&&b&&a.net-b.net<=-3){let worst=null;for(const d of DERS){const dd=a.ders[d.k].net-b.ders[d.k].net;if(!worst||dd<worst.dd)worst={d,dd}}
      const tri=examsOf(s.id).slice(-3).map(e=>fmt(score(e.id,s.id).ders[worst.d.k].net,0));out.push({s,k:'down',tag:'Düşüş',short:`${SHORT[worst.d.k]} ${tri.join(' → ')}`,pr:1});}
    else if(rep.length)out.push({s,k:'down',tag:'Tekrar eden hata',short:`${rep[0].ad}: ${rep[0].count} denemede yanlış`,pr:2});
    else if(a&&b&&a.net-b.net>=5)out.push({s,k:'up',tag:'Gelişim',short:`Toplam net ${fmt(b.net,0)} → ${fmt(a.net,0)}`,pr:6});
  }
  for(const t of DB.tasks)if(isOverdue(t)){const s=stu(t.sid);if(!out.some(o=>o.s.id===s.id&&o.tag==='Gecikme'))out.push({s,k:'n',tag:'Gecikme',short:`${t.konu} görevi ${t.cozulen}/${t.adet}`,pr:5})}
  return out.sort((a,b)=>a.pr-b.pr);
}
const isOverdue=t=>t.due<dISO(TODAY)&&t.cozulen<t.adet;
function classKonu(cls,dk,eid){ // % correct per konu for a class on exam
  const e=DB.exams.find(x=>x.id===eid);const ss=DB.students.filter(s=>s.cls===cls);
  return KONU[dk].map((_,j)=>{let c=0,t=0;const wrong=[];for(const s of ss){const r=DB.results[eid]?.[s.id];if(!r||!r.kz)continue;let w=false;e.key[dk].forEach((q,i)=>{if(q.k===j&&q.c!=='guess'){t++;if(r.a[dk][i]==='d')c++;if(r.a[dk][i]==='y')w=true}});if(w)wrong.push(s.id)}return t?{p:Math.round(c/t*100),wrong}:{p:null,wrong:[]}});
}

  [...new Set(ids)].forEach(id=>DB.notifs.unshift({id:'b'+uid(),to:id,text,link,read:false,at:Date.now()}));}
const veliOf=sid=>DB.users.filter(u=>u.role==='veli'&&u.status==='approved'&&u.childId===sid).map(u=>u.id);
const ogrOf=sid=>DB.users.filter(u=>u.role==='ogrenci'&&u.status==='approved'&&u.studentId===sid).map(u=>u.id);
function automations(){
  let ch=false;
  for(const t of DB.tasks){
    if(isOverdue(t)&&!t.overNotified){t.overNotified=true;ch=true;const s=stu(t.sid);notify('admins',`Görev aksadı: ${s.name} · ${t.konu} (${t.cozulen}/${t.adet}, son gün ${trD(t.due)})`,{page:'ogrenci',sid:t.sid,tab:'gorev'});}
    if(t.repeat&&!t.spawned&&(t.cozulen>=t.adet||t.due<dISO(TODAY))){t.spawned=true;ch=true;const nd=dISO(addD(7,pD(t.due)<TODAY?TODAY:pD(t.due)));DB.tasks.push({...t,id:'t'+uid(),cozulen:0,due:nd,spawned:false,overNotified:false,doneAt:null,at:Date.now()});
      notify(ogrOf(t.sid),`Haftalık görevin yenilendi: ${t.konu} · ${t.adet} soru · son gün ${trD(nd)}`,{page:'gorevler'});}
  }
  if(ch)save();
}

/* ============ TOTP ============ */
function b32(s){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const c of s.replace(/=+$/,'').toUpperCase())bits+=A.indexOf(c).toString(2).padStart(5,'0');const out=[];for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(out)}
async function totp(secret,step=0){if(!crypto?.subtle)return null;const ctr=Math.floor(Date.now()/30000)+step;const buf=new ArrayBuffer(8),v=new DataView(buf);v.setUint32(0,Math.floor(ctr/4294967296));v.setUint32(4,ctr>>>0);
  const k=await crypto.subtle.importKey('raw',b32(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf));const o=h[h.length-1]&15;
  return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1000000).padStart(6,'0')}

function lineChart(vals,labels,ids,opt={}){
  const W=opt.w||640,H=opt.h||240,top=28,bot=H-34,mn=Math.min(...vals),mx=Math.max(...vals),lo=Math.floor((mn-4)/10)*10,hi=Math.ceil((mx+4)/10)*10;
  const Y=v=>bot-(v-lo)/(hi-lo||1)*(bot-top),X=i=>52+i*((W-80)/Math.max(1,vals.length-1));
  const g=[];for(let v=lo;v<=hi;v+=10)g.push(`<line x1="42" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="34" y="${Y(v)+4}" text-anchor="end" fill="var(--muted)" font-size="12">${v}</text>`);
  const pts=vals.map((v,i)=>X(i)+','+Y(v)).join(' ');
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible" role="img" aria-label="Toplam net: ${vals.map(v=>fmt(v)).join(', ')}">${g.join('')}
  ${opt.avg?`<line x1="42" x2="${W-10}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--muted)" stroke-dasharray="5 5"/>`:''}
  <polygon points="${X(0)},${bot} ${pts} ${X(vals.length-1)},${bot}" fill="var(--primary)" opacity=".08"/>
  <polyline class="draw" pathLength="1" points="${pts}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  ${vals.map((v,i)=>`<g ${ids?`class="xl" data-act="examDetail" data-a="${ids[i]}" role="button" tabindex="0" aria-label="${esc(labels[i])} detayı"`:''}><rect x="${X(i)-30}" y="${top-20}" width="60" height="${H-top+14}" fill="transparent"/><circle cx="${X(i)}" cy="${Y(v)}" r="6" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/><text x="${X(i)}" y="${Y(v)-13}" text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="600">${fmt(v)}</text><text class="lbl" x="${X(i)}" y="${H-10}" text-anchor="middle" fill="var(--muted)" font-size="12.5" ${ids?'text-decoration="underline"':''}>${esc(labels[i])}</text></g>`).join('')}</svg>`;
}

function startUpload(file){
  const ex=exams(),e=ex.length;const name=S.up.name||('TG-'+(DB.exams.filter(x=>x.name.startsWith('TG-')).length+1));
  const typo={'Zeynep Kaya':'Zegnep Kaya','Kerem Aydın':'Kerm Aydın','İrem Tekin':'Irem Tekın'};
  const raw=DB.students.map(s=>({sid:s.id,raw:typo[s.name]||s.name}));raw.push({sid:null,raw:'Bora Tan'});
  S.up={...S.up,step:'read',file,name,date:S.up.date||dISO(TODAY),raw,ai:'run',fixes:[],issues:[],notify:S.up.notify??true};render();
  const roster=DB.students.map(s=>s.name);
  const bad=raw.filter(r=>!roster.includes(r.raw)).map(r=>r.raw);
  const finish=(matches,src)=>{
    const fixes=[],issues=[];
    for(const b of bad){const m=matches.find(x=>x.raw===b);if(m&&m.match&&roster.includes(m.match)&&m.sure!==false)fixes.push({raw:b,name:m.match,src});else issues.push({type:'unknown',raw:b,done:false})}
    const mert=DB.students.find(s=>s.name==='Mert Demir');issues.push({type:'dyb',sid:mert.id,name:mert.name,d:15,y:3,b:1,done:false});
    S.up={...S.up,ai:'done',fixes,issues,fixSrc:src};render();
    setTimeout(()=>{if(S.up.step==='read'){S.up.step='review';render()}},900);
  };
  const fallback=()=>finish(bad.map(b=>{let best=null,bd=9;for(const n of roster){const d=lev(fold(b),fold(n));if(d<bd){bd=d;best=n}}return{raw:b,match:bd<=2?best:null,sure:bd<=2}}),'Kural tabanlı');
  if(SAMPLE){
    SAMPLE.json(`Bir okul deneme sınavı PDF'inden okunan öğrenci isimlerinde optik kodlama/yazım hataları var (eksik veya yanlış harf, Türkçe karakter eksikliği). Aşağıdaki okul listesindeki gerçek isimlerle eşleştir. Emin değilsen match alanını null yap; benzemeyen bir ismi zorla eşleştirme.\n\nOkul listesi:\n${roster.join('\n')}\n\nPDF'den okunan hatalı isimler:\n${bad.join('\n')}\n\nYalnızca şu biçimde JSON dizi döndür: [{"raw":"okunan isim","match":"listeden birebir isim veya null","sure":true}]`,{modelTier:'quick'})
    .then(r=>finish(Array.isArray(r)?r:[],'Yapay zekâ')).catch(()=>fallback());
  }else setTimeout(fallback,1400);
}

/* ============ REPORTS ============ */
function reportData(sid,eid){
  const s=stu(sid),ex=examsOf(sid).filter(e=>e.date<=DB.exams.find(x=>x.id===eid).date),sc=ex.map(e=>({e,x:score(e.id,sid)}));
  const cur=sc.at(-1),prev=sc.at(-2);
  const rep=repeats(sid,eid);
  const lastWrong=[];DERS.forEach(d=>KONU[d.k].forEach(([c,ad],j)=>{if(konuStatus(eid,sid,d.k,j)==='y')lastWrong.push({dk:d.k,ad,code:c})}));
  const kzMissing=DERS.every(d=>KONU[d.k].every((_,j)=>['o','n'].includes(konuStatus(eid,sid,d.k,j))));
  return {s,ex,sc,cur,prev,rep,lastWrong,kzMissing};
}
function genVeli(sid,eid){
  const R=reportData(sid,eid),{s,sc,cur,prev,rep}=R,first=s.name.split(' ')[0],x=cur.x,h=hash(sid+eid);
  const pick=(arr,o=0)=>arr[(h+o)%arr.length];
  const level=x.net>=78?'high':x.net>=55?'mid':'low';
  const dn=prev?x.net-prev.x.net:0;
  const dd=DERS.map(d=>({d,n:x.ders[d.k].net,p:prev?.x.ders[d.k].net,b:x.ders[d.k].b,r:x.ders[d.k].net/d.q,hist:sc.slice(-3).map(q=>q.x.ders[d.k].net)}));
  const rising=dd.filter(q=>q.hist.length>=3&&q.hist[2]>q.hist[1]&&q.hist[1]>q.hist[0]);

const VELI_RULES=`Buluş Küre Koleji Rehberlik & Mentörlük sistemi için "Veli İçin Çıktı" raporunun metin bölümlerini yaz.
KURALLAR:
- Öğrenciyi başka öğrencilerle değil, kendi önceki denemeleriyle karşılaştır. Sınıf sıralaması kullanma.
- Dil: bir öğretmenin öğrencisini tanıyarak veliye yaptığı açıklama gibi doğal, sıcak, profesyonel, anlaşılır, yargılamayan Türkçe. Mekanik/yapay zekâ gibi cümleler kurma.
- Her öğrenciye aynı kalıpla başlama; başlangıç cümlesini öğrencinin durumuna göre çeşitlendir.
- Akış: genel durum → güçlü yönler → geliştirilecek alanlar → somut öneriler.
- Yalnızca eksik anlatma; güçlü yönleri mutlaka belirt.
- Sorunu somutlaştır ("Matematik çalışmalı" gibi genel öneri yazma). Kazanım bilgisi yoksa veya güvenilir değilse uydurma; yalnızca ders verisinden konuş.
- Tekrar eden hata (aynı konu birden çok denemede yanlış) > tek seferlik hata. Tek yanlıştan "konu eksiği" hükmü çıkarma.
- Boş soruları otomatik konu eksiği sayma; süre, dikkat, strateji de olabilir, birlikte değerlendirmeyi öner.
- Seviyeye göre yorum: çok yüksek netli öğrenciye "daha çok çalışmalı" deme, dikkat/kontrol/küçük eksikler; orta seviyede ulaşılabilir artışlar; düşük seviyede moral bozmadan birkaç temel hedef.
- Öneriler veriye bağlı ve somut olsun (3–5 öneri).
- Geçmiş denemeleri kullan (son değişim, son 3 deneme eğilimi); gereksiz rakam bombardımanı yapma, sayı kullanırsan ardından insan diliyle yorumla.
- Aynı dersi parça parça tekrar etme; bir ders hakkındaki bilgileri tek doğal cümle grubunda birleştir.
- YASAK ifadeler: başarısız, yetersiz, tembel, çok kötü, seviyesi düşük, başarısı zayıf, bu konuyu bilmiyor, kesinlikle dikkat hatası, kesinlikle süre problemi.
- Veliye teknik kelime veya kazanım kodu gösterme (OCR, parser, confidence, CODE_EXACT, TEXT_MATCH, SEMANTIC_MATCH, JSON, T.8.3.26 gibi kodlar). Konuyu adıyla anlat.
- Psikolojik çıkarım yapma (kaygı vb.) — veri yok.
- Uzunluk: genel değerlendirme yaklaşık 100–180 kelime; tekrar eden cümle yok.
- Rakam uydurma; yalnızca verilen veriyi kullan.`;

  return `<div class="rwrap" id="rwrap" role="dialog" aria-modal="true" aria-label="Rapor">${bar}<article class="paper" id="paperEl">${content}</article></div>`;
}

    ind.style.transition='none';if(prev){ind.style.transform=prev.t;if(!vert)ind.style.width=prev.w+'px'}else{ind.style.transform=next;if(!vert)ind.style.width=w+'px'}

  if(id==='fLogin'){const em=lower((S.f.email||'').trim()),u=DB.users.find(x=>lower(x.email)===em);
    if(!u||u.pass!==S.f.pass){S.auth.err='E-posta veya şifre hatalı.';return render()}
    if(u.role==='admin'){S.auth={step:'totp',pending:u.id,email:u.email};S.f.code='';return render()}
    loginAs(u)}
  if(id==='fTotp'){const code=(S.f.code||'').replace(/\D/g,'');const ok=[await totp(ADMIN_SECRET,-1),await totp(ADMIN_SECRET,0),await totp(ADMIN_SECRET,1)];
    if(ok[1]===null){S.auth.err='Bu tarayıcıda doğrulama yapılamıyor.';return render()}
    if(!ok.includes(code)){S.auth.err='Kod hatalı ya da süresi doldu. Uygulamadaki güncel kodu yaz.';return render()}
    loginAs(user(S.auth.pending))}
  if(id==='fReg'){const f=S.f,err=[];const em=(f.email||'').trim();
    if(!(f.name||'').trim())err.push('Ad soyad gerekli.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))err.push('Geçerli bir e-posta yaz.');else if(DB.users.some(u=>lower(u.email)===lower(em)))err.push('Bu e-posta zaten kayıtlı.');
    if((f.pass||'').length<8)err.push('Şifre en az 8 karakter olmalı.');else if(f.pass!==f.pass2)err.push('Şifreler aynı değil.');
    if(f.role==='ogretmen'&&!f.brans)err.push('Branşını seç.');if(f.role==='ogrenci'&&!f.cls)err.push('Şubeni seç.');if(f.role==='veli'&&(!(f.childName||'').trim()||!f.childCls))err.push('Öğrencinin adını ve şubesini yaz.');
    if(err.length){S.auth.err=err.join(' ');return render()}
    const u={id:'u'+uid(),email:em,pass:f.pass,name:f.name.trim(),role:f.role,status:'pending',at:Date.now()};
    if(f.role==='ogretmen')u.brans=f.brans;if(f.role==='ogrenci'){u.cls=f.cls;u.no=(f.no||'').trim()}if(f.role==='veli'){u.childName=f.childName.trim();u.childCls=f.childCls;u.rel=f.rel||'Anne'}
    DB.users.push(u);notify('admins',`Yeni kayıt onay bekliyor: ${u.name} (${ROLE_TR[roleOf(u)]}${u.brans?' · '+u.brans:''})`,{page:'onaylar'});save();S.f={role:'ogrenci'};S.auth={step:'sent'};render()}
  if(id==='fNote'){const t=(S.m.note||'').trim();if(!t)return toast('Önce notu yaz','warn');const vis=S.m.vis||'ogretmen';DB.notes.push({id:'n'+uid(),sid:S.sid,by:S.uid,vis,text:t,at:Date.now()});
    if(vis==='veli')notify(veliOf(S.sid),`Öğretmen notu: ${t.slice(0,80)}`,{page:'ozet'});if(roleOf()==='brans')notify('staff',`${me().name} not ekledi: ${stu(S.sid).name}`,{page:'ogrenci',sid:S.sid,tab:'notlar'});
    S.m.note='';save();render();toast('Not kaydedildi')}
  if(id==='fTask')ACT.taskSave();if(id==='fMeet')ACT.meetSave();if(id==='fEtut')ACT.etutSave();
});
function loginAs(u){S.uid=u.id;try{localStorage.setItem('bk-rm-uid',u.id)}catch(e){};S.f={role:'ogrenci'};S.auth={step:'login'};S.page=null;automations();render();if(u.status==='approved')toast('Hoş geldin, '+u.name.split(' ')[0]);}
window.addEventListener('resize',()=>{indPos={};placeInds()});

/* boot */
load();try{const id=localStorage.getItem('bk-rm-uid');if(id&&user(id))S.uid=id}catch(e){}
automations();render();
if(document.fonts?.ready)document.fonts.ready.then(()=>{indPos={};placeInds()});
</script>
</body></html>

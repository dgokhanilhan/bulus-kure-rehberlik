[package]
name = "bk-yoklama"
version = "0.1.0"
description = "BK Akıllı Yoklama — akıllı tahtadan sabah yoklaması"
authors = ["Buluş Küre Koleji"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "bk_yoklama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
